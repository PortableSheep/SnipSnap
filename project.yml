name: SnipSnap
options:
  bundleIdPrefix: com.snipsnap
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: 13.0
    SWIFT_VERSION: 5.0
    # Signing supports two modes:
    #   1. Local dev (default): Create a self-signed Code Signing certificate in
    #      Keychain Access matching `SNIPSNAP_CODE_SIGN_IDENTITY` and trust it.
    #      No Apple Developer Program required.
    #   2. CI / Developer ID: Override SNIPSNAP_CODE_SIGN_IDENTITY and
    #      SNIPSNAP_DEVELOPMENT_TEAM via xcodebuild command-line arguments.
    SNIPSNAP_DEVELOPMENT_TEAM: ""
    DEVELOPMENT_TEAM: "$(SNIPSNAP_DEVELOPMENT_TEAM)"
    CODE_SIGN_STYLE: Manual
    SNIPSNAP_CODE_SIGN_IDENTITY: "SnipSnap Local Dev"
    CODE_SIGN_IDENTITY: "$(SNIPSNAP_CODE_SIGN_IDENTITY)"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    # Prevent entitlement injection that changes the signature hash between builds
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    # Use anchor-based designated requirement so TCC recognizes rebuilds as the same app
    OTHER_CODE_SIGN_FLAGS: "--timestamp=none -o runtime"
    INFOPLIST_FILE: Info.plist
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
  configs:
    Debug:
      # Disable Swift debug dylib to avoid code signing mismatch with self-signed certificate.
      # The dylib gets signed with ad-hoc identity before our signing runs, causing Team ID errors.
      SWIFT_ENABLE_INCREMENTAL_COMPILATION: NO

targets:
  SnipSnap:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Editor
      - path: Sources/Hotkeys
      - path: Sources/IPC
      - path: Sources/Permissions
      - path: Sources/Preferences
      - path: Sources/Pro
      - path: Sources/Recording
      - path: Sources/Resources
      - path: Sources/Strip
    dependencies:
      - target: CaptureService
        embed: true
        codeSign: true
        copyPhase:
          destination: xpcServices
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snipsnap.Snipsnap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Re-sign Sparkle helpers
        script: |
          # Sparkle's pre-built helper binaries are ad-hoc signed. Re-sign them
          # with the same identity as the main app so macOS allows loading.
          SPARKLE_FW="${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
          if [ -d "$SPARKLE_FW" ] && [ "$CODE_SIGN_IDENTITY" != "-" ] && [ -n "$CODE_SIGN_IDENTITY" ]; then
            SIGN_FLAGS="--force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\""
            if [ -n "${OTHER_CODE_SIGN_FLAGS:-}" ]; then
              SIGN_FLAGS="$SIGN_FLAGS ${OTHER_CODE_SIGN_FLAGS}"
            fi
            find "$SPARKLE_FW" -type f -perm +111 \
              ! -name "*.plist" ! -name "*.strings" ! -name "*.nib" \
              -exec sh -c "eval codesign $SIGN_FLAGS \"{}\"" \;
            echo "✅ Re-signed Sparkle framework helpers with ${CODE_SIGN_IDENTITY}"
          fi
    entitlements:
      path: SnipSnap.entitlements
      properties:
        com.apple.security.cs.disable-library-validation: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SnipSnap
        CFBundleName: SnipSnap
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        NSHighResolutionCapable: true
        LSUIElement: true
        NSScreenCaptureUsageDescription: SnipSnap needs Screen Recording permission to capture your screen.
        SUFeedURL: https://portablesheep.github.io/snipsnap/appcast.xml
        SUPublicEDKey: "F/ram4+XMkAhklEyc9TP5rCQn/h611jy3n6RdyRFl2Q="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400

  SnipSnapTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SnipSnapTests
    dependencies:
      - target: SnipSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snipsnap.SnipSnapTests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  SnipSnapUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/SnipSnapUITests
    dependencies:
      - target: SnipSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snipsnap.SnipSnapUITests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

  CaptureService:
    type: xpc-service
    platform: macOS
    sources:
      - path: CaptureServiceXPC
      - path: Sources/IPC/CaptureServiceProtocol.swift
        name: CaptureServiceProtocol
      - path: Sources/Recording
        name: Recording
      - path: Sources/Permissions
        name: Permissions
      - path: Sources/Preferences/HUDPlacement.swift
        name: HUDPlacement
      - path: Sources/App/DebugLog.swift
        name: DebugLog
    settings:
      base:
        PRODUCT_NAME: com.snipsnap.CaptureService
        PRODUCT_BUNDLE_IDENTIFIER: com.snipsnap.CaptureService
        INFOPLIST_FILE: CaptureServiceXPC/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: CaptureServiceXPC/CaptureService.entitlements
    info:
      path: CaptureServiceXPC/Info.plist
      properties:
        CFBundleDisplayName: SnipSnap Capture Service
        CFBundleName: CaptureService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: XPC!
        XPCService:
          ServiceType: Application
        NSScreenCaptureUsageDescription: SnipSnap needs Screen Recording permission to capture your screen.
