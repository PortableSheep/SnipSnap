name: Build macOS Release

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCHEME: SnipSnap
  PROJECT: SnipSnap.xcodeproj

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Code Signing Certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          rm "$CERT_PATH"
          
          # Allow codesign to access the keychain without prompting
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to search list (prepend so it's found first)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "✅ Certificate imported successfully"

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#release/}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version in project
        run: |
          # Update version in Info.plist via xcodebuild settings
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Version: $VERSION, Build: $BUILD_NUMBER"
        
      - name: Build Release
        env:
          SS_LICENSE_PUBLIC_KEY_V1: ${{ secrets.SS_LICENSE_PUBLIC_KEY_V1 }}
        run: |
          xcodebuild \
            -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp -o runtime" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SS_LICENSE_PUBLIC_KEY_V1="$SS_LICENSE_PUBLIC_KEY_V1" \
            build

      - name: Re-sign embedded frameworks for notarization
        run: |
          APP_PATH="build/Build/Products/Release/SnipSnap.app"
          SIGN_IDENTITY="Developer ID Application"
          SIGN_FLAGS="--timestamp -o runtime"
          
          # Sparkle.framework contains pre-built binaries that xcodebuild doesn't
          # re-sign with our Developer ID cert. Apple notarization requires every
          # binary in the bundle to be signed with Developer ID + secure timestamp.
          # Sign inside-out: deepest binaries first, then bundles, then framework.
          
          SPARKLE_FW="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          
          if [ -d "$SPARKLE_FW" ]; then
            echo "🔏 Re-signing Sparkle framework binaries..."
            
            # Find and sign all Mach-O binaries inside the framework (inside-out)
            find "$SPARKLE_FW" -type f \( -name "*.dylib" -o -perm +111 \) | while read -r binary; do
              # Skip non-Mach-O files (e.g. plists, shell scripts)
              if file "$binary" | grep -q "Mach-O"; then
                echo "   Signing: ${binary#$APP_PATH/}"
                codesign --force --sign "$SIGN_IDENTITY" $SIGN_FLAGS "$binary"
              fi
            done
            
            # Re-sign XPC services (as bundles)
            find "$SPARKLE_FW" -name "*.xpc" -type d | while read -r xpc; do
              echo "   Signing bundle: ${xpc#$APP_PATH/}"
              codesign --force --sign "$SIGN_IDENTITY" $SIGN_FLAGS "$xpc"
            done
            
            # Re-sign nested .app bundles
            find "$SPARKLE_FW" -name "*.app" -type d | while read -r app; do
              echo "   Signing bundle: ${app#$APP_PATH/}"
              codesign --force --sign "$SIGN_IDENTITY" $SIGN_FLAGS "$app"
            done
            
            # Re-sign the framework itself
            echo "   Signing: Sparkle.framework"
            codesign --force --sign "$SIGN_IDENTITY" $SIGN_FLAGS "$SPARKLE_FW"
            
            echo "✅ Sparkle framework re-signed"
          fi
          
          # Re-sign the outer app bundle (seal updated after framework re-signing)
          echo "🔏 Re-signing SnipSnap.app..."
          codesign --force --sign "$SIGN_IDENTITY" $SIGN_FLAGS \
            --entitlements SnipSnap.entitlements \
            "$APP_PATH"
          
          # Verify the final signature
          echo "🔍 Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"
          echo "✅ Signature verification passed"

      - name: Notarize App
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/notarize.sh
          ./scripts/notarize.sh "build/Build/Products/Release/SnipSnap.app"

      - name: Create DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="build/Build/Products/Release/SnipSnap.app"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="SnipSnap-${VERSION}.dmg"
          
          # Create temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          ln -s /Applications dmg_contents/Applications
          
          # Add install instructions
          cat > dmg_contents/README.txt << 'EOF'
          SnipSnap Installation
          =====================
          
          Drag SnipSnap.app to the Applications folder and launch.
          
          This app is signed and notarized by Apple — no additional steps needed.
          EOF
          
          # Create DMG
          hdiutil create -volname "SnipSnap" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"
          
          # Sign the DMG
          codesign --sign "Developer ID Application" \
            --timestamp \
            "$DMG_NAME"
          
          # Notarize the DMG
          ./scripts/notarize.sh "$DMG_NAME"
          
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "Created: $DMG_NAME"

      - name: Create ZIP
        run: |
          APP_PATH="build/Build/Products/Release/SnipSnap.app"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="SnipSnap-${VERSION}.zip"
          
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_NAME"
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Created: $ZIP_NAME"

      - name: Sign ZIP with Sparkle EdDSA
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_EDDSA_PRIVATE_KEY" ]; then
            echo "⚠️  SPARKLE_EDDSA_PRIVATE_KEY not set — skipping Sparkle signing"
            echo "SPARKLE_SIGNATURE=" >> $GITHUB_ENV
            echo "ZIP_SIZE=$(stat -f%z "$ZIP_NAME")" >> $GITHUB_ENV
            exit 0
          fi
          
          # Download Sparkle CLI tools
          SPARKLE_VERSION="2.9.0"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          mkdir -p sparkle_tools
          tar -xf sparkle.tar.xz -C sparkle_tools
          
          # Write private key to a temp file (sign_update requires a file path)
          KEY_FILE=$(mktemp)
          echo -n "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          
          # Sign the ZIP with EdDSA
          SIGNATURE=$(./sparkle_tools/bin/sign_update "$ZIP_NAME" -f "$KEY_FILE")
          
          # Clean up key file
          rm -f "$KEY_FILE"
          
          echo "SPARKLE_SIGNATURE=$SIGNATURE" >> $GITHUB_ENV
          
          # Get file size
          ZIP_SIZE=$(stat -f%z "$ZIP_NAME")
          echo "ZIP_SIZE=$ZIP_SIZE" >> $GITHUB_ENV
          echo "✅ Sparkle EdDSA signature generated"

      - name: Generate appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ github.run_number }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${ZIP_NAME}"
          CHANGELOG=$(cat release_notes.md 2>/dev/null || echo "")
          
          python3 scripts/generate-appcast.py \
            --version "$VERSION" \
            --build "$BUILD" \
            --url "$DOWNLOAD_URL" \
            --signature "$SPARKLE_SIGNATURE" \
            --size "$ZIP_SIZE" \
            --changelog "$CHANGELOG" \
            --output docs/appcast.xml

      - name: Publish appcast to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "Update appcast.xml for v${{ steps.version.outputs.version }}" || echo "No appcast changes"
          git push || echo "Push failed — appcast update will be included in next push"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          BODY=$(./scripts/generate-changelog.sh "" HEAD)
          # Write to file for the release step (handles multiline safely)
          echo "$BODY" > release_notes.md
          echo "Generated changelog for release"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipSnap-${{ steps.version.outputs.version }}-dmg
          path: ${{ env.DMG_NAME }}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipSnap-${{ steps.version.outputs.version }}-zip
          path: ${{ env.ZIP_NAME }}

      # Upload to GitHub Release for tags and release branches
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            ${{ env.DMG_NAME }}
            ${{ env.ZIP_NAME }}
          draft: false
          body_path: release_notes.md
          name: SnipSnap ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup Keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
