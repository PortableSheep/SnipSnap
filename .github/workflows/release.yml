name: Build macOS Release

on:
  push:
    branches:
      - 'release/**'
      - 'release/*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

env:
  SCHEME: SnipSnap
  PROJECT: SnipSnap.xcodeproj

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Code Signing Certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "⚠️  No signing certificate configured — build will be unsigned."
            echo "   To fix: run scripts/generate-release-cert.sh and add secrets."
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "$P12_BASE64" | base64 --decode > certificate.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import certificate.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')

          rm -f certificate.p12
          echo "✅ Signing certificate imported."
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#release/}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update version in project
        run: |
          # Update version in Info.plist via xcodebuild settings
          VERSION="${{ steps.version.outputs.version }}"
          BUILD_NUMBER="${{ github.run_number }}"
          echo "Version: $VERSION, Build: $BUILD_NUMBER"
        
      - name: Build Release
        env:
          SS_LICENSE_PUBLIC_KEY_V1: ${{ secrets.SS_LICENSE_PUBLIC_KEY_V1 }}
        run: |
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            SIGN_IDENTITY="SnipSnap Release"
            SIGN_REQUIRED=YES
            SIGN_ALLOWED=YES
          else
            SIGN_IDENTITY="-"
            SIGN_REQUIRED=NO
            SIGN_ALLOWED=NO
          fi

          xcodebuild \
            -project $PROJECT \
            -scheme $SCHEME \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            CODE_SIGNING_REQUIRED="$SIGN_REQUIRED" \
            CODE_SIGNING_ALLOWED="$SIGN_ALLOWED" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SS_LICENSE_PUBLIC_KEY_V1="$SS_LICENSE_PUBLIC_KEY_V1" \
            build

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/SnipSnap.app"
          VERSION="${{ steps.version.outputs.version }}"
          DMG_NAME="SnipSnap-${VERSION}.dmg"
          
          # Create temporary directory for DMG contents
          mkdir -p dmg_contents
          cp -R "$APP_PATH" dmg_contents/
          cp scripts/install.sh dmg_contents/
          chmod +x dmg_contents/install.sh
          ln -s /Applications dmg_contents/Applications
          
          # Add install instructions
          cat > dmg_contents/README.txt << 'EOF'
          SnipSnap Installation
          =====================
          
          Option 1: Drag & Drop
          ---------------------
          Drag SnipSnap.app to the Applications folder.
          Then run in Terminal:
            xattr -rd com.apple.quarantine /Applications/SnipSnap.app
          
          Option 2: Run Install Script
          ----------------------------
          Double-click install.sh or run in Terminal:
            ./install.sh
          
          The script handles the quarantine removal automatically.
          EOF
          
          # Create DMG
          hdiutil create -volname "SnipSnap" \
            -srcfolder dmg_contents \
            -ov -format UDZO \
            "$DMG_NAME"
          
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV
          echo "Created: $DMG_NAME"

      - name: Create ZIP
        run: |
          APP_PATH="build/Build/Products/Release/SnipSnap.app"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="SnipSnap-${VERSION}.zip"
          
          # Create distribution folder with app and install script
          mkdir -p dist
          cp -R "$APP_PATH" dist/
          cp scripts/install.sh dist/
          chmod +x dist/install.sh
          
          # Create ZIP
          cd dist
          zip -r -y "../$ZIP_NAME" .
          cd ..
          
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          echo "Created: $ZIP_NAME"

      - name: Generate changelog
        id: changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          BODY=$(./scripts/generate-changelog.sh "" HEAD)
          # Write to file for the release step (handles multiline safely)
          echo "$BODY" > release_notes.md
          echo "Generated changelog for release"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipSnap-${{ steps.version.outputs.version }}-dmg
          path: ${{ env.DMG_NAME }}

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnipSnap-${{ steps.version.outputs.version }}-zip
          path: ${{ env.ZIP_NAME }}

      # Upload to GitHub Release for tags and release branches
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            ${{ env.DMG_NAME }}
            ${{ env.ZIP_NAME }}
          draft: false
          body_path: release_notes.md
          name: SnipSnap ${{ steps.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
